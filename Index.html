<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LUMEN STUDIO | Fotografía</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- SECCIÓN 1: LOGOTIPO -->
    <header class="encabezado">
<!-- VISOR DE FOTOGRAFÍAS -->
<div id="visor" class="visor">
    <span id="cerrar">&times;</span>
    <img id="imagenGrande" src="" alt="Fotografía ampliada">
</div>
        <div class="logo">
            <h1>LUMEN <span>STUDIO</span></h1>
            <p>Capturando momentos únicos</p>
        </div>

    </header>
<!-- SECCIÓN 3: CONTENIDO PRINCIPAL -->
    <main>

        <section id="inicio" class="presentacion">
            <h2>Capturando momentos únicos</h2>
            <p>
                La fotografía es el arte de conservar
                recuerdos y contar historias a través de imágenes.
            </p>
        </section>

        <!-- GALERÍA -->
        <section id="galeria" class="galeria">
            <h2>Nuestra Galería</h2>
            <p class="descripcion">
                Una colección de momentos especiales.
            </p>

            <div class="contenedor-fotos">

                <article class="foto">
                    <img src="img/foto1.jpg"
                         alt="Paisaje natural">
                    <h3>Naturaleza</h3>
                </article>

                <article class="foto">
                    <img src="img/foto2.jpg"
                         alt="Fotografía de una ciudad">
                    <h3>Ciudad</h3>
                </article>

                <article class="foto">
                    <img src="img/foto3.jpg"
                         alt="Fotografía de atardecer">
                    <h3>Atardeceres</h3>
                </article>

            </div>
        </section>

    </main>
    <script src="script.js"></script>
<!-- SECCIÓN 2: MENÚ DE NAVEGACIÓN -->
    <nav class="menu">
        <a href="#inicio">Inicio</a>
        <a href="#galeria">Galería</a>
        <a href="#servicios">Servicios</a>
        <a href="#contacto">Contacto</a>
    </nav>
</body>

</html>
